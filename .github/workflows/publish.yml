name: Publish milestone

on:
  push:
    paths:
      - .github/workflows/publish.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply milestone files
        run: |
          curl -fsSL -o /tmp/milestone.tar.gz "https://n.uguu.se/VYQOgDgqFQth.tar.gz"
          echo "21ee7d0e2db4f2b50ea5b5012029dee7ae9ec6d9c63eb61ede5a49b17d1e9faa  /tmp/milestone.tar.gz" | sha256sum -c -
          tar -xzf /tmp/milestone.tar.gz -C .
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
      - name: Commit
        run: |
          git config user.name "arpitgoswami"
          git config user.email "71710858+arpitgoswami@users.noreply.github.com"
          git add CHANGELOG.md Cargo.lock Cargo.toml README.md docs/architecture.md \
            src/app/mod.rs src/bus/mod.rs src/cartridge/mapper.rs src/cartridge/mod.rs \
            src/emulator/mod.rs src/ppu/mod.rs tests/cartridge.rs tests/emulator.rs
          git diff --cached --stat
          git commit -m "Complete MMC5 nametables and PCM, VRC6 banking, Quattro and PAL timing"
          git push origin HEAD:main
