name: Publish milestone

# Temporary workflow: applies the mapper-milestone tarball, verifies it and
# commits the result. Removed again once the milestone is on main.
on:  
  push:
    branches: [main]
    paths:
      - .github/workflows/publish.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply milestone files
        run: |
          curl -fsSL https://n.uguu.se/WKRmXhvckGJl.tar.gz -o /tmp/milestone.tar.gz
          echo "44296a104a7c9e8726d6d67bcb1df587571098f469398cfc3590cb8c1fa2cbca  /tmp/milestone.tar.gz" | sha256sum -c -
          tar -xzf /tmp/milestone.tar.gz -C .
      - name: Verify
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
      - name: Commit
        run: |
          git config user.name "Arpit Goswami"
          git config user.email "71710858+arpitgoswami@users.noreply.github.com"
          git add -A
          git reset -q -- .github
          git commit -m "Add MMC5 split-screen, ExRAM attributes and MMC5/VRC6 expansion audio"
          git push
