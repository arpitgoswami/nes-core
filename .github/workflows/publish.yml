name: Publish milestone

on:
  push:
    paths:
      - .github/workflows/publish.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply milestone files
        run: |
          curl -fsSL -o /tmp/milestone.tar.gz "https://h.uguu.se/VVQzVodvKbyO.tar.gz"
          echo "53d5672abc5792256bb39d7be4d8c2465505c26afc0fca87c904d87e3d2b1114  /tmp/milestone.tar.gz" | sha256sum -c -
          tar -xzf /tmp/milestone.tar.gz -C .
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
      - name: Commit
        run: |
          git config user.name "arpitgoswami"
          git config user.email "71710858+arpitgoswami@users.noreply.github.com"
          git add CHANGELOG.md Cargo.lock Cargo.toml README.md docs/architecture.md \
            src/app/mod.rs src/cartridge/mapper.rs src/cartridge/mod.rs src/ppu/mod.rs \
            tests/cartridge.rs
          git diff --cached --stat
          git commit -m "Add MMC2, MMC4, Color Dreams, GxROM and Camerica mappers"
          git push origin HEAD:main
