name: Publish milestone sources

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-milestone
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Download sources
        run: |
          curl -fsSL -o /tmp/src.tar.gz "https://d.uguu.se/UYDqomzbnStE.tar.gz"
          echo "d18331a0ff4b106d274dc5f984c7f7c3e37284aef2e73b7d3ab6fcd35f87e61f  /tmp/src.tar.gz" | sha256sum -c -
          tar -xzf /tmp/src.tar.gz -C .
      - name: Checks
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
      - name: Commit
        run: |
          git config user.name "Arpit Goswami"
          git config user.email "71710858+arpitgoswami@users.noreply.github.com"
          git add -A
          git reset -q -- .github
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Add MMC5 and VRC6 mappers" -m "Implement MMC5 (5) and VRC6 (24/26) banking, IRQs, ExRAM and the MMC5 multiplier, with tests, README, architecture notes and a 0.2.0 version bump."
          git push
