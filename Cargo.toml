[package]
name = "nes-core"
version = "0.5.0"
edition = "2021"
rust-version = "1.80"
description = "An open-source NES emulator with a modern desktop GUI, written in Rust"
license = "MIT"
repository = "https://github.com/arpitgoswami/nes-core"
readme = "README.md"
keywords = ["nes", "emulator", "6502", "egui"]
categories = ["emulators", "gui"]

[lib]
name = "nes_core"
path = "src/lib.rs"

[[bin]]
name = "nes-core"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "wgpu",
    "x11",
    "wayland",
    "default_fonts",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# ALSA is loaded at runtime, so building on Linux needs no development headers.
libloading = "0.8"

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
